# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
#

name: build

on:
  push:
    branches: [ main, dev, dev** ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:

    name: Build, test, and lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14", pypy-3.11]
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install .[testing]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -p no:smtpd --cov --no-cov-on-fail --cov-fail-under=100

  extras:

    name: Additional OS Tests
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.14"]
    timeout-minutes: 5
    env:
      GITHUB_ACTIONS_RUNNER_TLS_NO_VERIFY: 1

    steps:
    - uses: actions/checkout@v6
    - name: Fix asyncio localhost on macOS
      if: ${{ matrix.os == 'macos-latest'}}
      run: |
        # On macOS, asyncio resolves "localhost" to ::1 (IPv6) which can cause
        # connection failures in CI. Force tests to use 127.0.0.1 instead.
        echo "SMTPD_HOST=127.0.0.1" >> $GITHUB_ENV
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install .[testing]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      timeout-minutes: 2

      run: |
        pytest -p no:smtpd

  typing:
    name: Ensure package is typed
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install mypy .
    - name: Check typing
      run: |
        mypy

  minimum:

    name: Check minimum dependency versions
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14", pypy-3.11]
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements/minimum/requirements.txt
        pip install --no-deps .
    - name: Test with pytest
      run: |
        pytest -p no:smtpd
